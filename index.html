<!DOCTYPE html>
<html lang="en">

<head>
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta charset="UTF-8">
	<meta name="viewport"
		content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, shrink-to-fit=no, viewport-fit=cover">
	<meta name="color-scheme" content="light dark">

	<title>Zhi Liang</title>

	<!-- Favicon -->
	<!--<link rel="shortcut icon" href="./assets/img/favicon/favicon.ico" type="image/x-icon">-->
	<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

	<!-- Font -->
	<link rel="preconnect" href="https://fonts.gstatic.com">
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700" rel="stylesheet">

	<!-- Radzen CSS -->
	<link rel="stylesheet" href="_content/Radzen.Blazor/css/standard-base.css">
	<link rel="stylesheet" href="_content/Blazored.Toast/blazored-toast.css" />
	<style>
		body {
			background-position: 0% 0%;
		}

		.transition-effect {
			transition: opacity 0.5s ease;
			/* 这里的 0.5s 是动画持续时间，可以根据需要调整 */
			opacity: 1;
		}

		.transition-effect.hidden {
			opacity: 0;
		}
	</style>
	<link href="lib/simplebar/simplebar.css" rel="stylesheet" />
	<!-- Template CSS -->
	<link class="css-lt" rel="stylesheet" href="./css/css-lt.css" media="(prefers-color-scheme: light)">
	<link class="css-dk" rel="stylesheet" href="./css/css-dk.css" media="(prefers-color-scheme: dark)">

	<!-- Theme Manager -->
	<script src="js/theme-manager.js"></script>
	<!-- Theme mode -->
	<script>
		// 存储用户代理
		var userAgent = navigator.userAgent;
		localStorage.setItem('UserAgent', userAgent);
		console.log('UserAgent:', userAgent);
		// 主题切换函数 - 由 C# 通过 JSInterop 调用
		window.setColorScheme = function (scheme, animated) {
			console.log('setColorScheme called:', scheme, 'animated:', animated);
			ThemeManager.setScheme(scheme, animated);
		}
		// 获取系统暗色模式状态
		window.getDarkModeStatus = function () {
			return window.matchMedia('(prefers-color-scheme: dark)').matches;
		}
		// 系统主题检测(调试用)
		if (window.matchMedia) {
			const darkModeMediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
			console.log('系统主题:', darkModeMediaQuery.matches ? 'Dark' : 'Light');

			darkModeMediaQuery.addEventListener('change', (e) => {
				console.log('系统主题切换到:', e.matches ? 'Dark' : 'Light');
			});
		}
	</script>

	<!-- Original Begin -->
	<base href="/" />
	<!--<link href="lib/bootstrap/css/bootstrap.min.css" rel="stylesheet" />-->
	<link href="lib/font-awesome/css/all.min.css" rel="stylesheet" />
	<link href="lib/animate.css/animate.min.css" rel="stylesheet" />
	<link href="css/loading.css" rel="stylesheet" />
	<!--<link href="css/app.css" rel="stylesheet" />-->
	<link href="css/treegrid.css" rel="stylesheet" />
	<link href="ZhiMedia.Client.styles.css" rel="stylesheet" />
	<!--<link href="manifest.json" rel="manifest" />-->
	<link href="manifest.webmanifest" rel="manifest" />
	<link rel="apple-touch-icon" sizes="512x512" href="logo512.png" />
	<link rel="apple-touch-icon" sizes="192x192" href="logo192.png" />
	<style>
		.swal-modal {
			border-radius: 1rem !important;
		}
	</style>
	<!-- Original End -->
</head>

<body>
	<div id="app">
		<div class="loading">Loading&#8230;</div>
	</div>
	<div id="blazor-error-ui">
		<!--An unhandled error has occurred.
		<a href="" class="reload">Reload</a>
		<a class="dismiss">🗙</a>-->
	</div>
	<script src="_framework/blazor.webassembly.js"></script>

	<!-- Radzen JS -->
	<script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>

	<script>
		/*navigator.serviceWorker.register('service-worker.js');*/
		navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
	</script>
	<script src="lib/jquery/jquery.min.js"></script>
	<script src="lib/sweetalert/sweetalert.min.js"></script>
	<script src="lib/simplebar/simplebar.min.js"></script>
	<script>

		$(function () {

			var observer = new MutationObserver(function (mutations) {
				swal({
					title: "An unknown critical error has occurred",
					text: "All that can be done at the moment is to have the page automatically refresh and reload all programs after clicking the button below.",
					icon: "error",
					buttons: {
						OK: "OK"
					},
					dangerMode: true
				}).then(() => {
					window.location.reload();
				});;
			});
			var target = document.querySelector('#blazor-error-ui');
			observer.observe(target, {
				attributes: true
			});

		});



	</script>

	<!-- template -->
	<script src="./assets/js/vendor.js"></script>
	<!--<script src="./assets/js/template.js"></script>-->
	<script src="./assets/js/pack.js"></script>
</body>

</html>
